# Target: p4d.24xlarge — 8x A100 40 GB (320 GB total)  ← RECOMMENDED
# Use spot instances: saves ~65% cost (~$11/hr vs $32.77/hr)
model:
  path: Qwen/Qwen2.5-VL-7B-Instruct

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

dataset:
  train_jsonl: data/processed/train.jsonl
  val_jsonl: data/processed/val.jsonl
  image_root: data/raw

prompt: "document parsing."
max_length: 4096
augment: true

training_args:
  output_dir: outputs/lora_p4d
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4      # effective batch = 64
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  bf16: true
  gradient_checkpointing: false       # enough VRAM — faster without it
  logging_steps: 10
  save_steps: 500
  eval_strategy: steps
  eval_steps: 500
  save_total_limit: 3
  dataloader_num_workers: 8
  report_to: none
  ddp_find_unused_parameters: false
