# EnclaveScribe iter-5 — 32B LoRA on g5.12xlarge (4x A10G 24GB, spot)
#
# Same experiment as configs/train/iter5.yaml. Retuned 2026-09-11 for
# g5.12xlarge after AWS partially approved only 64 vCPU of G spot quota,
# which fits g5.12xlarge (48 vCPU) but not g5.48xlarge (192 vCPU).
#
# TARGETED HARDWARE: 4x A10G 24GB (96GB total VRAM). Per-GPU weight shard
# with FSDP full_shard = 64GB/4 = 16GB, leaving ~6-8GB for activations+
# LoRA+grad buckets on each 24GB card. Tight but workable.
#
# CHANGES vs iter5.yaml (p4de baseline):
#   - max_pixels    1280*28*28 -> 512*28*28   (401,408)
#       Weight shard is 16GB/GPU vs iter5.yaml's 8GB/GPU (4 GPUs vs 8),
#       so activations must be smaller. 512 pixels is the safe floor.
#   - LoRA r        64 -> 16   (alpha 128 -> 32)
#       Quartered vs p4de config; iter-3 shipped on r=32, 32B has more
#       base capacity to absorb even at r=16. Keeps optimizer state
#       small enough to fit alongside the 16GB weight shard.
#   - grad_accum    8 -> 8     (kept at 8 for 4 GPUs -> eff batch 32)
#   - save_steps    200 -> 50
#       Spot resilience: max ~1h lost work on preempt, given ~2min/step
#       wallclock estimate on A10G.
#
# UNCHANGED vs iter5.yaml:
#   - base model, LR, epochs, warmup, FSDP config, attention backend
#
# LAUNCH:
#   torchrun --nproc_per_node=4 scripts/train.py --config configs/train/iter5_g5.yaml
#
# ROLLBACK PATH: if LoRA+FSDP crashes at step 0 (untested combo on A10G),
# fall back to plain DDP by removing the fsdp/fsdp_config keys below.
# If OOM at step 0, drop max_pixels 512 -> 448 (351,232) first.

use_unsloth: false

model:
  # 2026-09-11: pivoted from allenai/olmOCR-2-32B-1025 (does not exist on HF)
  # to Qwen2.5-VL-32B-Instruct, the base olmOCR-7B was distilled from.
  # Same arch family, same 5120 hidden dim, ~64 layers, bf16 weights ~64GB.
  # Caveat: not OCR-pretrained — starts from general VL instruct capabilities.
  path: Qwen/Qwen2.5-VL-32B-Instruct
  flash_attn: false
  # Tightened for 4x A10G (16GB weight shard/GPU); iter-4 ran at 640, but
  # 4-GPU sharding leaves less activation headroom than 8-GPU would.
  min_pixels: 200704                # 256 * 28 * 28
  max_pixels: 401408                # 512 * 28 * 28

lora:
  r: 16                             # quartered vs p4de config for 24GB budget
  alpha: 32                         # 2 * r
  dropout: 0.05

dataset:
  train_jsonl: data/processed/train.jsonl
  val_jsonl:   data/processed/val.jsonl
  image_root:  data/raw

prompt: "Extract this document page as clean markdown. Preserve the original script exactly."
max_length: 8192
augment: true

training_args:
  output_dir: outputs/iter5
  num_train_epochs: 4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8    # eff batch = 8 * 4 GPUs = 32 (match iter5.yaml)
  learning_rate: 1.0e-4             # FLOAT — never write as 1e-4 (YAML 1.1 -> str)
  lr_scheduler_type: cosine
  warmup_steps: 20
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  use_liger_kernel: true
  ddp_find_unused_parameters: false
  remove_unused_columns: false
  logging_steps: 5
  save_steps: 50                    # tight for spot preempt resilience
  eval_steps: 100
  save_total_limit: 3
  dataloader_num_workers: 8
  report_to: "wandb"
  run_name: "enclave-scribe-iter5-32b-g5"
  fsdp: "full_shard auto_wrap"
  fsdp_config:
    fsdp_transformer_layer_cls_to_wrap: "Qwen2_5_VLDecoderLayer"
