# EnclaveScribe iter-5 — 32B LoRA, g5.48xlarge fallback (8x A10G 24GB)
#
# Same experiment as configs/train/iter5.yaml but tuned for A10G's tighter
# VRAM budget. Use this when P-instance quota is unavailable and G quota
# lands first, or as the cost-optimized path (g5.48xlarge on-demand ~$16.29/hr
# vs p4de.24xlarge on-demand ~$32.77/hr).
#
# TARGETED HARDWARE: 8x A10G 24GB (192GB total VRAM). Bandwidth per-GPU is
# 600 GB/s vs A100's 2 TB/s, so per-step wallclock is ~3-5x slower than
# p4de. Wallclock roughly matches p4de's cost because per-hour is cheaper.
#
# CHANGES vs configs/train/iter5.yaml (p4de baseline):
#   - max_pixels    1280*28*28 -> 640*28*28
#       32B weights sharded across 8 GPUs = 8GB/GPU. LoRA optim ~1GB.
#       Activations at max_pixels=1280 + 8192 seq are ~10-15GB per GPU on
#       A10G, blowing the 24GB budget. Drop to 640 (matches iter-4 A10G
#       proven config) to keep activations ~5-8GB.
#   - LoRA r        64 -> 32   (alpha 128 -> 64)
#       Halves LoRA trainable params + optimizer state; saves ~1-2GB per
#       GPU. Iter-3 shipped on r=32 successfully — proven config, less
#       capacity than 64 but the base model still has more room to
#       absorb than a 7B.
#   - grad_accum    8 -> 4
#       iter5.yaml assumes 4 GPUs (eff batch 32 = 1*8*4). g5.48xlarge has
#       8 GPUs, so 4*8*1 also gives eff batch 32.
#
# UNCHANGED vs iter5.yaml:
#   - base model, LR, epochs, warmup, FSDP config, attention backend
#
# LAUNCH:
#   torchrun --nproc_per_node=8 scripts/train.py --config configs/train/iter5_g5.yaml
#
# ROLLBACK PATH: if LoRA+FSDP crashes at step 0 (untested combo on A10G),
# fall back to plain DDP by removing the fsdp/fsdp_config keys below.

use_unsloth: false

model:
  path: allenai/olmOCR-2-32B-1025
  flash_attn: false
  # Lower than p4de's 1280 — A10G VRAM budget for 32B activations.
  min_pixels: 200704                # 256 * 28 * 28
  max_pixels: 501760                # 640 * 28 * 28

lora:
  r: 32                             # halved vs p4de config; iter-3 shipped on r=32
  alpha: 64                         # 2 * r
  dropout: 0.05

dataset:
  train_jsonl: data/processed/train.jsonl
  val_jsonl:   data/processed/val.jsonl
  image_root:  data/raw

prompt: "Extract this document page as clean markdown. Preserve the original script exactly."
max_length: 8192
augment: true

training_args:
  output_dir: outputs/iter5
  num_train_epochs: 4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4    # eff batch = 4 * 8 GPUs = 32 (match iter5.yaml)
  learning_rate: 1.0e-4             # FLOAT — never write as 1e-4 (YAML 1.1 -> str)
  lr_scheduler_type: cosine
  warmup_steps: 20
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  use_liger_kernel: true
  ddp_find_unused_parameters: false
  remove_unused_columns: false
  logging_steps: 5
  save_steps: 200
  eval_steps: 200
  save_total_limit: 3
  dataloader_num_workers: 8
  report_to: "wandb"
  run_name: "enclave-scribe-iter5-32b-g5"
  fsdp: "full_shard auto_wrap"
  fsdp_config:
    fsdp_transformer_layer_cls_to_wrap: "Qwen2VLDecoderLayer"
