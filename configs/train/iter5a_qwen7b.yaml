# EnclaveScribe iter-5a — Qwen2.5-VL-7B-Instruct + iter-4 corpus
#
# 2026-09-11 pivot from the retired 32B scope (see
# configs/train/attic/iter5_g5_32b_failed_2026-09-11.yaml). This run
# isolates one variable: does olmOCR's OCR distillation head-start
# actually help Devanagari, or was iter-4 held back by distillation
# biases from an English/Latin-heavy pretraining set?
#
# Base is Qwen2.5-VL-7B-Instruct — same VLM olmOCR-7B was distilled
# from, so target_modules in scribe/train/lora.py stays valid — but
# without any OCR-specific pretraining. Fresh LoRA r=16/alpha=32.
#
# Success gate: word CER on data/benchmark/himalaya_500.jsonl
#   <= 21.5%  → matches iter-3, ships.
#   > 21.5%   → OCR distillation was helping. Do not ship.
# Companion is iter5b (bigger LoRA on olmOCR-7B) — see plan.
#
# TARGETED HARDWARE: 1x A10G 24GB (g5.4xlarge spot). Same machine
# iter-4 shipped on; no FSDP, no offload heroics, no sharding.

use_unsloth: false

model:
  path: Qwen/Qwen2.5-VL-7B-Instruct
  flash_attn: false
  # Proven on A10G by iter-4 at max_pixels=640; kept identical here.
  min_pixels: 200704                # 256 * 28 * 28
  max_pixels: 501760                # 640 * 28 * 28

lora:
  r: 16                             # smaller than iter-3's 32 to keep
                                    # trainable-param count comparable
                                    # to iter-5b even though r differs
  alpha: 32                         # 2 * r
  dropout: 0.05

dataset:
  train_jsonl: data/processed/train.jsonl
  val_jsonl:   data/processed/val.jsonl
  image_root:  data/raw

prompt: "Extract this document page as clean markdown. Preserve the original script exactly."
max_length: 8192
augment: true

training_args:
  output_dir: outputs/iter5a
  num_train_epochs: 4               # 2x iter-4's 2; iter-4 undertrained
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8    # eff batch = 8 * 1 GPU = 8
  learning_rate: 1.0e-4             # FLOAT — never 1e-4 (YAML-1.1 str)
  lr_scheduler_type: cosine
  warmup_steps: 20
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  use_liger_kernel: true
  ddp_find_unused_parameters: false
  remove_unused_columns: false
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  save_total_limit: 3
  dataloader_num_workers: 4
  report_to: "wandb"
  run_name: "enclave-scribe-iter5a-qwen7b"
