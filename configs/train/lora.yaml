model:
  path: Qwen/Qwen2.5-VL-7B-Instruct

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

dataset:
  train_jsonl: data/processed/train.jsonl
  val_jsonl: data/processed/val.jsonl
  image_root: data/raw

prompt: "document parsing."
max_length: 4096
augment: true

training_args:
  output_dir: outputs/lora
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  bf16: true
  logging_steps: 10
  save_steps: 500
  eval_strategy: steps
  eval_steps: 500
  save_total_limit: 3
  dataloader_num_workers: 4
  report_to: none
