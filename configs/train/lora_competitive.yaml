# EnclaveScribe — Competitive Training Config
#
# Target   : p4d.24xlarge SPOT  (8x A100 40GB, 320GB total)
# Cost     : ~$11/hr spot → 300K samples, 3 epochs → ~25-30 hrs → ~$275-330
# Precision: bf16 full LoRA — NO quantization, NO quality compromise
# Flash Att: enabled — required for long document sequences (4096 tokens)
#
# This config targets competitive scores on:
#   OmniDocBench, DocVQA, TextVQA, OCR-Bench, InfoVQA
#
# Launch:
#   torchrun --nproc_per_node=8 scripts/train.py --config configs/train/lora_competitive.yaml

model:
  path: Qwen/Qwen2.5-VL-7B-Instruct
  flash_attn: true                     # required for 4096-token doc sequences

lora:
  r: 128                               # higher rank → more capacity → better benchmark scores
  alpha: 256
  dropout: 0.05
  target_modules:                      # cover all attention + MLP layers
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

dataset:
  train_jsonl: data/processed/train.jsonl
  val_jsonl: data/processed/val.jsonl
  image_root: data/raw

prompt: "document parsing."
max_length: 4096
augment: true

training_args:
  output_dir: outputs/lora_competitive
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4      # effective batch = 64
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  bf16: true
  tf32: true                          # A100 TF32 — free throughput boost
  gradient_checkpointing: false       # 320GB total — no need, runs faster without
  optim: adamw_torch_fused            # fused optimizer — faster on A100
  logging_steps: 10
  save_steps: 200
  eval_strategy: steps
  eval_steps: 200
  save_total_limit: 5
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  ddp_find_unused_parameters: false
  report_to: none
