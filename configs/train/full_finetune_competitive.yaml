# EnclaveScribe — Full Fine-tune (Maximum Quality)
#
# Target   : p4de.24xlarge SPOT  (8x A100 80GB, 640GB total)
# Cost     : ~$13/hr spot → 500K samples, 2 epochs → ~30-40 hrs → ~$390-520
# Precision: bf16 full fine-tune — all parameters trained
# Use after LoRA validates — this is your final production model
#
# Launch:
#   torchrun --nproc_per_node=8 scripts/train.py --config configs/train/full_finetune_competitive.yaml

model:
  path: Qwen/Qwen2.5-VL-7B-Instruct
  flash_attn: true

dataset:
  train_jsonl: data/processed/train.jsonl
  val_jsonl: data/processed/val.jsonl
  image_root: data/raw

prompt: "document parsing."
max_length: 4096
augment: true

training_args:
  output_dir: outputs/full_competitive
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4      # effective batch = 64
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  bf16: true
  tf32: true
  gradient_checkpointing: true        # full FT needs memory
  optim: adamw_torch_fused
  logging_steps: 10
  save_steps: 200
  eval_strategy: steps
  eval_steps: 200
  save_total_limit: 3
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  ddp_find_unused_parameters: false
  fsdp: "full_shard auto_wrap"
  fsdp_config:
    fsdp_transformer_layer_cls_to_wrap: "Qwen2VLDecoderLayer"
    fsdp_backward_prefetch: "backward_pre"
  report_to: none
