# iter-10a MINI-EXPERIMENT — verify Qwen3-VL-8B verbose-format fix via 5k DocVQA fine-tune.
# Purpose: prove F1 > 0.30 on OCRBench V2 100-sample cut post-training.
# If YES: iter-10 recipe validated on Qwen3-VL-8B. If NO: revert to olmOCR-2-7B.
#
# RESULT (2026-09-16): F1 = 0.470 — hypothesis VALIDATED. See reports/iter10a/PROBE_REPORT.md.
#
# BASE-MODEL NOTE: Qwen3-VL-8B needs transformers >= 4.57 (model_type=qwen3_vl,
# arch Qwen3VLForConditionalGeneration). Confirmed on transformers 4.57.6.
# Loaded via `AutoModelForImageTextToText` in scribe/model/vlm.py — no code changes needed.

use_unsloth: false

model:
  path: Qwen/Qwen3-VL-8B-Instruct
  flash_attn: false
  min_pixels: 200704
  max_pixels: 200704

lora:
  r: 32
  alpha: 64
  dropout: 0.05

dataset:
  train_jsonl: data/processed/iter10a_train.jsonl
  val_jsonl:   data/processed/iter10a_val.jsonl
  image_root:  data/raw

prompt: "Extract this document page as clean markdown. Preserve the original script exactly."
max_length: 4096
augment: true

training_args:
  output_dir: outputs/iter10a
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 50
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  use_liger_kernel: false     # liger may not support Qwen3-VL yet; safer off for probe
  ddp_find_unused_parameters: false
  remove_unused_columns: false
  logging_steps: 25
  save_steps: 500
  eval_steps: 500
  save_total_limit: 2
  dataloader_num_workers: 2   # g5.xlarge has only 4 vCPUs
  report_to: "none"
  run_name: "iter10a-qwen3vl-probe"
