# EnclaveScribe — Competitive LoRA, Lambda Labs 1x A100 80GB
#
# Cost     : $1.99/hr fixed (no spot risk, no interruption)
# Hardware : 1x A100 80GB SXM4
# Time     : 300K samples, 3 epochs → ~38-42 hrs → ~$76-84
# Quality  : IDENTICAL to multi-GPU — same bf16, Flash Attn 2, LoRA r=128
#            (more GPUs = faster wall time, not better model quality)
#
# Budget breakdown with $500:
#   Run 1 (validate, 80K samples)  ~$12
#   Run 2 (full 300K samples)      ~$80
#   Runs 3-6 (tune + retrain)      ~$240
#   Buffer                         ~$168
#
# Launch on Lambda Labs:
#   pip install -e ".[train]"
#   python scripts/train.py --config configs/train/lora_lambda_a100.yaml

model:
  path: Qwen/Qwen2.5-VL-7B-Instruct
  flash_attn: true                     # required — handles 4096-token docs efficiently

lora:
  r: 128
  alpha: 256
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

dataset:
  train_jsonl: data/processed/train.jsonl
  val_jsonl: data/processed/val.jsonl
  image_root: data/raw

prompt: "document parsing."
max_length: 4096
augment: true

training_args:
  output_dir: outputs/lora_lambda_a100
  num_train_epochs: 3
  per_device_train_batch_size: 4      # 80GB easily handles bs=4 with flash attention
  gradient_accumulation_steps: 4      # effective batch = 16
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  bf16: true
  tf32: true                          # A100 TF32 — free throughput boost
  gradient_checkpointing: false       # 80GB — no need, faster without it
  optim: adamw_torch_fused
  logging_steps: 10
  save_steps: 300                     # Lambda has no spot interruption — can save less often
  eval_strategy: steps
  eval_steps: 300
  save_total_limit: 5
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  report_to: none
