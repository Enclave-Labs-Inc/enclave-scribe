# EnclaveScribe — Unsloth LoRA on AWS
#
# Recommended instance: g5.12xlarge SPOT (4x A10G 24GB = 96GB total)
#   Cost: ~$3.15/hr spot (us-east-1c, Aug 2026)
#   Time: ~10 hrs with Unsloth → ~$32 per run
#   Quota: request "All G and VT Spot Instance Requests" >= 48 vCPUs
#
# Alternative: p4d.24xlarge SPOT (8x A100 40GB = 320GB total)
#   Cost: ~$11/hr spot → ~$55 per run with Unsloth
#
# Launch:
#   torchrun --nproc_per_node=4 scripts/train.py --config configs/train/unsloth_aws.yaml
#   (use --nproc_per_node=8 for p4d.24xlarge)

use_unsloth: false   # true = single-GPU only (Unsloth free); false = HF Trainer + DDP on all 4 GPUs

model:
  path: Qwen/Qwen2.5-VL-7B-Instruct
  flash_attn: false   # flash-attn is not installed; sdpa is used automatically

lora:
  r: 32                # was 128 — OOM on 22GB A10G with r=128; 32 is enough for iter-1
  alpha: 64            # keep alpha = 2 * r
  dropout: 0

dataset:
  train_jsonl: data/processed/train.jsonl
  val_jsonl: data/processed/val.jsonl
  image_root: data/raw

prompt: "document parsing."
max_length: 4096
augment: true

training_args:
  output_dir: outputs/iter1
  num_train_epochs: 3
  per_device_train_batch_size: 1      # 22GB A10G — lm_head over 152k vocab needs ~1.2GB per batch=2, OOMs
  gradient_accumulation_steps: 8      # effective batch = 32 on 4 GPUs (1 * 8 * 4)
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false              # required for DDP + LoRA (default true breaks gradient flow)
  use_liger_kernel: true              # fuses lm_head + cross_entropy — avoids materialising fp32 logits (~2GB saved)
  ddp_find_unused_parameters: false   # LoRA has no unused params — avoid DDP overhead
  remove_unused_columns: false        # DocumentDataset returns dicts; Trainer must not drop keys
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  save_total_limit: 3
  dataloader_num_workers: 4
  report_to: "wandb"
  run_name: "enclave-scribe-iter1"
