# EnclaveScribe iter-4 — page-level Devanagari, continuing from iter-3
#
# Iter-3 learned Devanagari at the word level (17.4% CER, 93× better than
# base). Iter-4 teaches page-level document structure so the model handles
# full-page inputs without needing the runtime bad_words_ids workaround
# in scribe/agent/tools.py (PR #41).
#
# DATA STRATEGY (revised 2026-09-02 after himalaya-ai turned out to have
# no page-level content). Hybrid bootstrap:
#   1. scripts/prepare/prep_indicdlp_pages.py  — real page images from
#      ai4bharat/indicdlp (Hindi + Marathi, ~3k pages)
#   2. scripts/prepare/label_pages_with_iter3.py — pseudo-label each
#      page by running iter-3 + agent extract_page (uses the bad_words_ids
#      fix during labeling so pseudo-labels are clean)
#   3. scripts/prepare/build_iter4_corpus.py — mix ~2.5k pages + ~500
#      word-level replay samples (5:1) → data/processed/{train,val}.jsonl
#
# APPROACH: LOAD iter-3 adapter as starting point (resume_adapter), not
# fresh LoRA. Adapter config (r=32, α=64) reused from outputs/iter3/.
#
# Sized for SINGLE-GPU training (g5.xlarge, 1× A10G 24GB). Pages have
# ~2-5k text chars ≈ 1500-2500 tokens + 640 image tokens — fits in 8192.
# If OOM, drop max_length to 6144 or lower max_pixels in scripts/train.py.
#
# Approx cost: ~$5-7 for training itself; the bulk labeling in step 2 is
# the dominant cost (~$50-150 for 3k pages at iter-3's serial speed).

use_unsloth: false                # HF Trainer, single GPU

model:
  path: allenai/olmOCR-2-7B-1025  # same base as iter-3
  flash_attn: false

# Continue training from iter-3 adapter instead of fresh LoRA.
# S3: s3://enclave-scribe-checkpoints/outputs/iter3/
resume_adapter: outputs/iter3

# lora: not used when resume_adapter is set — the adapter config is
# read from outputs/iter3/adapter_config.json (r=32, alpha=64).

dataset:
  train_jsonl: data/processed/train.jsonl
  val_jsonl:   data/processed/val.jsonl
  image_root:  data/raw

prompt: "Extract this document page as clean markdown. Preserve the original script exactly."
max_length: 8192                  # pages have ~2-5× the tokens of word crops
augment: true

training_args:
  output_dir: outputs/iter4
  num_train_epochs: 2             # smaller dataset, more info per sample
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32 # effective batch 32
  learning_rate: 5e-5             # lower than iter-3 (1.5e-4) since we're
                                  # fine-tuning an already-trained adapter,
                                  # not starting from scratch
  lr_scheduler_type: cosine
  warmup_steps: 10                # short warmup — adapter already reasonable
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  use_liger_kernel: true
  ddp_find_unused_parameters: false
  remove_unused_columns: false
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  save_total_limit: 3
  dataloader_num_workers: 4
  report_to: "wandb"
  run_name: "enclave-scribe-iter4-pages"
