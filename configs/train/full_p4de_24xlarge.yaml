# Target: p4de.24xlarge — 8x A100 80 GB (640 GB total)
# Full fine-tune — no LoRA, trains all parameters
# Use spot instances: saves ~68% cost (~$13/hr vs $40.96/hr)
model:
  path: Qwen/Qwen2.5-VL-7B-Instruct

dataset:
  train_jsonl: data/processed/train.jsonl
  val_jsonl: data/processed/val.jsonl
  image_root: data/raw

prompt: "document parsing."
max_length: 4096
augment: true

training_args:
  output_dir: outputs/full_p4de
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4      # effective batch = 64
  learning_rate: 5.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  bf16: true
  gradient_checkpointing: true        # saves memory for full FT
  logging_steps: 10
  save_steps: 500
  eval_strategy: steps
  eval_steps: 500
  save_total_limit: 2
  dataloader_num_workers: 8
  report_to: none
  ddp_find_unused_parameters: false
  fsdp: "full_shard auto_wrap"        # shard model across 8 GPUs
  fsdp_config:
    fsdp_transformer_layer_cls_to_wrap: "Qwen2VLDecoderLayer"
